[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.4.10"
composeBom = "2026.02.01"
coil = "3.5.0"
codeScanner = "16.1.0"
datastore = "1.2.1"
kotlinxSerialization = "1.11.0"
lifecycleCompose = "2.11.0"
media3 = "1.11.0"
okhttp = "5.5.0"
