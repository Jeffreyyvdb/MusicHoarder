# Builds the app shell (mobile/) for iOS, signs it, and uploads it to App Store Connect, where it
# appears in TestFlight. release.yml dispatches it with the new version on every release; it can
# also be run by hand (Actions → iOS TestFlight → Run workflow).
#
# Signing is Xcode's automatic signing with an App Store Connect API key: the distribution
# certificate and the provisioning profile are made and kept in Apple's cloud, so no certificate
# file or password lives in this repo's secrets. The archive is built unsigned and only the export
# signs it, with Apple's cloud-managed distribution certificate. Signing the archive would make
# every fresh runner (an empty keychain each time) create a new Apple Development certificate,
# which fills the account's certificate limit within a few runs and then fails every build. The key
# must have the Admin role, which cloud signing needs.
#
# An unsigned archive carries no entitlements, and the export signs with the ones it finds. The
# app and its widget extension share a folder through an App Group, so between archive and export
# the bundles are signed ad hoc (no certificate) with theirs, and a first export that is only
# inspected proves the group survived before anything is uploaded. Without the group the widgets
# would be blank, and no build log would say why.
#
# Setup, once (see mobile/README.md, "iOS: TestFlight"):
#
#   secrets  APP_STORE_CONNECT_API_KEY_P8   the downloaded AuthKey_XXXX.p8, the whole file
#            APP_STORE_CONNECT_KEY_ID       its key id
#            APP_STORE_CONNECT_ISSUER_ID    the issuer id shown above the keys list
#            APPLE_TEAM_ID                  the team id of the paid membership
#   variable IOS_BUNDLE_ID                  optional; com.musichoarder.app by default. The widget
#                                           extension is <id>.widgets, the App Group group.<id>.
#
# Without the secrets the run reports why and stops, green: a fork builds nothing here.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build (X.Y.Z). Blank: the latest v* tag."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # App Store Connect takes uploads only from the iOS SDK it names (ITMS-90725), which moves up
    # each year. macos-latest stays on the previous Xcode for months after a new one ships, so the
    # job names the Xcode image itself, and the SDK step below refuses anything older.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Preflight — App Store Connect secrets
        id: preflight
        working-directory: .
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "${KEY_P8:-}" ] || missing+=(APP_STORE_CONNECT_API_KEY_P8)
          [ -n "${KEY_ID:-}" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "${ISSUER_ID:-}" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "${TEAM_ID:-}" ] || missing+=(APPLE_TEAM_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice title=iOS TestFlight skipped::Missing secrets: ${missing[*]}. See mobile/README.md, \"iOS: TestFlight\"."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error title=iOS TestFlight::APP_STORE_CONNECT_API_KEY_P8 is not a .p8 key. Paste the whole downloaded file, BEGIN/END lines included."; exit 1 ;;
          esac
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.preflight.outputs.ok == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        if: steps.preflight.outputs.ok == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            VERSION="${TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z, got '$VERSION'"; exit 1; }
          # The build number only has to grow for each version. The run number always does, also
          # when the same version is built twice (TestFlight refuses a build number it has seen).
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($RUN_NUMBER)"

      - name: Check the iOS SDK
        if: steps.preflight.outputs.ok == 'true'
        run: |
          set -euo pipefail
          MIN_SDK=27
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcodebuild -version
          if [ "${SDK%%.*}" -lt "$MIN_SDK" ]; then
            echo "::error title=iOS TestFlight::This runner's iOS SDK is $SDK; App Store Connect wants $MIN_SDK or later. Move runs-on to a newer Xcode image."
            exit 1
          fi
          echo "Building with the iOS $SDK SDK."

      - uses: oven-sh/setup-bun@v2
        if: steps.preflight.outputs.ok == 'true'
        with:
          bun-version: latest

      - if: steps.preflight.outputs.ok == 'true'
        run: bun install --frozen-lockfile

      # No MH_SERVER_URL: the app asks for a server on its first start, so one build serves every
      # instance.
      - if: steps.preflight.outputs.ok == 'true'
        run: bun run sync

      - name: Write the API key
        if: steps.preflight.outputs.ok == 'true'
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.preflight.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.musichoarder.app' }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MH_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | tail -n 40

      # Inside out, as codesign seals a bundle over the code nested in it: the embedded
      # frameworks, the widget extension, then the app. "-" is an ad hoc signature: no identity,
      # no certificate, nothing registered with Apple.
      - name: Sign the archive ad hoc, with its entitlements
        if: steps.preflight.outputs.ok == 'true'
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.musichoarder.app' }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          APPEX="$APP/PlugIns/MusicHoarderWidgets.appex"
          fail() { echo "::error title=iOS TestFlight::$1"; exit 1; }
          value() { /usr/libexec/PlistBuddy -c "Print :$1" "$2/Info.plist" 2>/dev/null || true; }
          [ -d "$APP" ] || fail "The archive holds no App.app."
          [ -d "$APPEX" ] || fail "The archived app has no PlugIns/MusicHoarderWidgets.appex."
          [ "$(value CFBundleIdentifier "$APP")" = "$BUNDLE_ID" ] \
            || fail "The archived app is '$(value CFBundleIdentifier "$APP")', expected '$BUNDLE_ID'."
          [ "$(value CFBundleIdentifier "$APPEX")" = "$BUNDLE_ID.widgets" ] \
            || fail "The widget extension is '$(value CFBundleIdentifier "$APPEX")', expected '$BUNDLE_ID.widgets'."
          # The group the code asks for at run time, as the build wrote it into both bundles.
          GROUP="$(value MHAppGroup "$APP")"
          [ "$GROUP" = "group.$BUNDLE_ID" ] \
            || fail "The app's MHAppGroup is '$GROUP', expected 'group.$BUNDLE_ID'."
          [ "$(value MHAppGroup "$APPEX")" = "$GROUP" ] \
            || fail "The widget extension names another App Group than the app."

          # The tracked entitlements, with the one build setting they use filled in.
          expand() {
            sed "s|[$](MH_APP_GROUP)|$GROUP|g" "$1" > "$2"
            if grep -q '[$](' "$2"; then fail "$1 uses a build setting this step does not fill in."; fi
            plutil -lint "$2" > /dev/null || fail "$1 is not a property list once filled in."
          }
          expand ios/App/App/App.entitlements "$RUNNER_TEMP/app.entitlements"
          expand ios/App/Widgets/Widgets.entitlements "$RUNNER_TEMP/widgets.entitlements"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -mindepth 1 -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' code; do codesign --force --sign - "$code"; done
          fi
          codesign --force --sign - --entitlements "$RUNNER_TEMP/widgets.entitlements" "$APPEX"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"

          for bundle in "$APP" "$APPEX"; do
            codesign -d --entitlements - --xml "$bundle" > "$RUNNER_TEMP/signed.entitlements" 2> /dev/null \
              || fail "codesign could not read back the entitlements of $(basename "$bundle")."
            grep -qF "$GROUP" "$RUNNER_TEMP/signed.entitlements" \
              || fail "$(basename "$bundle") does not hold the App Group after signing."
          done
          echo "APP_GROUP=$GROUP" >> "$GITHUB_ENV"

      # The same export as the upload below, but to a folder, so the signed result can be read
      # before it goes anywhere: an upload export leaves nothing behind to inspect.
      - name: Check the export keeps the App Group
        if: steps.preflight.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=iOS TestFlight::$1"; exit 1; }
          cat > "$RUNNER_TEMP/CheckOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/CheckOptions.plist" \
            -exportPath "$RUNNER_TEMP/check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -n 40

          IPA="$(find "$RUNNER_TEMP/check" -maxdepth 1 -name '*.ipa' -print -quit)"
          [ -n "$IPA" ] || fail "The check export wrote no .ipa."
          unzip -q "$IPA" -d "$RUNNER_TEMP/check/ipa"
          for bundle in Payload/App.app Payload/App.app/PlugIns/MusicHoarderWidgets.appex; do
            [ -d "$RUNNER_TEMP/check/ipa/$bundle" ] || fail "The exported app has no $bundle."
            codesign -d --entitlements - --xml "$RUNNER_TEMP/check/ipa/$bundle" > "$RUNNER_TEMP/check/entitlements" 2> /dev/null \
              || fail "codesign could not read the entitlements of the exported $bundle."
            grep -qF "$APP_GROUP" "$RUNNER_TEMP/check/entitlements" \
              || fail "The exported $bundle was signed without the App Group $APP_GROUP, so the widgets would be blank. Nothing was uploaded. See mobile/README.md, iOS: TestFlight."
          done
          echo "Both bundles are signed with $APP_GROUP."

      # Export for App Store Connect with `destination: upload`: xcodebuild signs for distribution
      # and uploads in one step, with the same key. The build then shows in TestFlight after
      # Apple's processing (usually 5–30 minutes).
      - name: Upload to App Store Connect
        if: steps.preflight.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -n 40

      - name: Remove the API key
        if: always() && env.KEY_PATH != ''
        run: rm -f "$KEY_PATH"
