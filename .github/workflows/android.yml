# Builds and unit-tests the native Android client. Split out of ci.yml so it only runs when the
# app actually changes — nothing under android/ compiles against the API or the frontend, so a
# backend-only PR has no reason to pay for a Gradle build.
#
# `android` is deliberately not one of main's required status checks (only `dotnet` and `frontend`
# are), which is what makes the path filter safe: a skipped run cannot leave a PR waiting forever
# on a check that will never report. If it is ever made required, drop the filter or give it a
# skipped-but-successful fallback job first.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `assembleRelease` runs alongside the debug build: with no keystore on a PR it only yields an
    # unsigned APK, but it is the one thing that exercises the release variant's config — and that
    # config breaking would otherwise surface in the release workflow, after a version has already
    # been cut.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches android/gradle/gradle-daemon-jvm.properties; without it Gradle would go and
          # provision its own toolchain on every run.
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Caches ~/.gradle and validates the committed wrapper jar. The build root comes from the
      # job's working-directory, not an input — `build-root-directory` no longer exists.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
