# Keeps the yt-dlp and deno pins in Dockerfile and Dockerfile.api-base current.
#
# Dependabot cannot do this: its docker ecosystem tracks FROM images only, and these two are
# binaries the Dockerfiles download by URL. This job reads each project's latest GitHub release,
# takes the checksum that project publishes for the asset, and opens one PR that bumps both files.
#
# Like the Dependabot config, it only proposes a release that has been out for COOLDOWN_DAYS, so a
# malicious release has time to be caught and yanked first. yt-dlp has to stay fresh (YouTube
# changes break old versions), which is why this runs daily and the commit is a fix(deps) that
# cuts a release and so rebuilds the images.
#
# The PR is opened with GITHUB_TOKEN, and GitHub does not start workflows for events that token
# causes: the required checks do not run on their own. Close and reopen the PR (or push to it) to
# start them. "Allow GitHub Actions to create and approve pull requests" must be on in the repo's
# Actions settings.
name: tool-pins

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tool-pins
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COOLDOWN_DAYS: '3'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find newer releases
        id: find
        shell: bash
        run: |
          set -euo pipefail
          files=(Dockerfile Dockerfile.api-base)
          cutoff=$(date -u -d "-${COOLDOWN_DAYS} days" +%s)
          summary=()

          current() { grep -m1 -E "^ARG $1=" Dockerfile | cut -d= -f2; }

          # Prints the newest release tag older than the cooldown, or nothing.
          settled_tag() {
            gh api "repos/$1/releases?per_page=20" --jq '.[] | select(.draft == false and .prerelease == false) | "\(.tag_name) \(.published_at)"' |
              while read -r tag published; do
                if [ "$(date -u -d "$published" +%s)" -le "$cutoff" ]; then echo "$tag"; break; fi
              done
          }

          # True when $1 is a later version than $2 (never step back below a hand-set pin).
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          set_arg() { for f in "${files[@]}"; do sed -i -E "s|^ARG $1=.*|ARG $1=$2|" "$f"; done; }

          ytdlp=$(settled_tag yt-dlp/yt-dlp)
          if [ -n "$ytdlp" ] && newer "$ytdlp" "$(current YTDLP_VERSION)"; then
            sha=$(curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${ytdlp}/SHA2-256SUMS" | awk '$2 == "yt-dlp_linux" { print $1 }')
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "No checksum for yt-dlp_linux in $ytdlp"; exit 1; }
            set_arg YTDLP_VERSION "$ytdlp"; set_arg YTDLP_SHA256 "$sha"
            summary+=("yt-dlp $ytdlp")
          fi

          deno=$(settled_tag denoland/deno)
          if [ -n "$deno" ] && newer "$deno" "$(current DENO_VERSION)"; then
            sha=$(curl -fsSL "https://github.com/denoland/deno/releases/download/${deno}/deno-x86_64-unknown-linux-gnu.zip.sha256sum" | awk '{ print $1 }')
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "No checksum for deno $deno"; exit 1; }
            set_arg DENO_VERSION "$deno"; set_arg DENO_SHA256 "$sha"
            summary+=("deno $deno")
          fi

          if [ ${#summary[@]} -eq 0 ]; then
            echo "Pins are current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          joined=$(IFS=,; echo "${summary[*]}")
          joined=${joined//,/ and }
          slug=$(printf '%s' "$joined" | tr -c 'a-zA-Z0-9.' '-')
          {
            echo "changed=true"
            echo "summary=$joined"
            echo "branch=deps/tool-pins-$slug"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.find.outputs.changed == 'true'
        shell: bash
        env:
          SUMMARY: ${{ steps.find.outputs.summary }}
          BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists; a PR for this bump is open or was closed on purpose."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am "fix(deps): bump ${SUMMARY} in the API images"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "fix(deps): bump ${SUMMARY} in the API images" \
            --body "Bumps the pinned ${SUMMARY} in \`Dockerfile\` and \`Dockerfile.api-base\`, with the checksums the projects publish. Opened by \`tool-pins.yml\`.

          The required checks do not start on a PR opened by \`GITHUB_TOKEN\`: close and reopen this PR to run them."
