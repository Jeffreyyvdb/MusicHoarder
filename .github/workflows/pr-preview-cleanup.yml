# Safety-net reaper for orphaned PR preview stacks.
#
# The pr-preview.yml `teardown` job normally deletes a preview when its PR closes. If that is ever
# missed (workflow disabled, transient Dokploy error, a delete that failed half-way, a deploy that
# Dokploy finished after the teardown), this job removes every preview whose PR is no longer open:
# the pr-<n> compose in the previews environment, and the containers, volumes and isolated network
# named mh-pr-<n>-* left on the host. The network matters most: Dokploy never removes it, and the
# host runs out of Docker address pools after about 30 of them, which stops every new preview.
# See `reap` in scripts/dokploy-preview.sh.
name: PR preview cleanup (Dokploy)

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the previews and what would be removed"
        type: boolean
        default: true

# Never two sweeps at once; a teardown running beside one is harmless (every step is idempotent).
concurrency:
  group: pr-preview-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # remove the stale "preview" label from reaped PRs

jobs:
  reap:
    name: Reap closed-PR previews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Destroy previews for closed PRs
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_PREVIEW_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_PREVIEW_ENVIRONMENT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A scheduled run has no inputs and always removes; a manual run lists unless told not to.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_URL}" ] || [ -z "${DOKPLOY_API_KEY}" ] || [ -z "${DOKPLOY_PREVIEW_ENVIRONMENT_ID}" ]; then
            echo "::notice::Dokploy preview secrets not set — nothing to reap."
            exit 0
          fi
          ./scripts/dokploy-preview.sh reap
