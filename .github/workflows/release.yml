name: Release

# Unified semantic-release for the whole repo. Every push to main is analyzed for
# Conventional Commits across BOTH the .NET API and the SvelteKit frontend; a single
# `vX.Y.Z` git tag + GitHub Release is cut covering both. When a release happens this
# workflow dispatches aspire-deploy.yml with the new version, which builds and semver-tags
# the api + frontend images and redeploys Dokploy; it also attaches the Android APK to the Release
# and uploads the Android App Bundle to Google Play.
# `workflow_dispatch` triggered by the default GITHUB_TOKEN is permitted to start the
# downstream run (the one exception to the "GITHUB_TOKEN-created events don't trigger workflows"
# rule), so no PAT is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # semantic-release v25+ requires Node ^22.14.0 || >=24.10.0. Bun's runtime reports
      # process.versions.node = 20.x, so the release step runs under Node via `npx`.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Set up here rather than with the Android steps below so the signing preflight can run
      # *before* semantic-release: a broken keystore config is then reported on every push to main,
      # release or not, instead of surfacing after a version has already been cut.
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          # Matches android/gradle/gradle-daemon-jvm.properties.
          distribution: temurin
          java-version: '25'

      # Checks the four signing secrets without building anything. It deliberately never fails the
      # job — an Android-only problem must not hold back the API/frontend deploy. It emits an error
      # annotation and reports ok=false, which makes the APK step fall back to the debug build: the
      # release still carries an installable APK and the run says why it is not signed.
      - name: Preflight — Android signing secrets
        id: android_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail

          emit() { echo "ok=$1" >> "$GITHUB_OUTPUT"; }
          fail() {
            echo "::error title=Android signing preflight::$1"
            emit false
            exit 0
          }

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — a release would attach a debug-signed APK. See android/README.md."
            emit false
            exit 0
          fi

          [ -n "${MH_KEYSTORE_PASSWORD:-}" ] || fail "ANDROID_KEYSTORE_PASSWORD is not set."
          [ -n "${MH_KEY_ALIAS:-}" ]         || fail "ANDROID_KEY_ALIAS is not set."
          [ -n "${MH_KEY_PASSWORD:-}" ]      || fail "ANDROID_KEY_PASSWORD is not set. Gradle passes it separately from the store password, so signing fails without it. For a PKCS12 keystore it equals ANDROID_KEYSTORE_PASSWORD."

          KS="$RUNNER_TEMP/preflight.jks"
          PROBE_DIR="$RUNNER_TEMP/preflight-probe"
          PROBE_JAR="$RUNNER_TEMP/preflight-probe.jar"
          rm -rf "$KS" "$PROBE_DIR" "$PROBE_JAR"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS" 2>/dev/null || true
          [ -s "$KS" ] || fail "ANDROID_KEYSTORE_BASE64 did not decode to a file. Re-encode it — on macOS: base64 -i keystore.jks | tr -d '\n' | gh secret set ANDROID_KEYSTORE_BASE64"

          keytool -list -keystore "$KS" -storepass "$MH_KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || fail "Cannot open the keystore. Either ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEYSTORE_BASE64 does not hold a keystore."

          keytool -list -keystore "$KS" -storepass "$MH_KEYSTORE_PASSWORD" -alias "$MH_KEY_ALIAS" >/dev/null 2>&1 \
            || fail "ANDROID_KEY_ALIAS does not name an entry in this keystore. List the aliases locally with: keytool -list -v -keystore <file> | grep 'Alias name'"

          # keytool cannot probe the key password — on a PKCS12 store it ignores -keypass entirely.
          # jarsigner calls KeyStore.getKey(alias, keyPassword) exactly like the Android Gradle
          # plugin, so signing a throwaway jar is the only check that reproduces a packageRelease
          # key failure.
          mkdir -p "$PROBE_DIR" && : > "$PROBE_DIR/probe.txt"
          jar cf "$PROBE_JAR" -C "$PROBE_DIR" . 2>/dev/null || fail "Could not build the probe jar."

          jarsigner -keystore "$KS" -storepass "$MH_KEYSTORE_PASSWORD" -keypass "$MH_KEY_PASSWORD" \
            "$PROBE_JAR" "$MH_KEY_ALIAS" >/dev/null 2>&1 \
            || fail "ANDROID_KEY_PASSWORD cannot unlock the key. For a PKCS12 keystore (anything keytool made recently) it must equal ANDROID_KEYSTORE_PASSWORD."

          # Surface the signing cert's SHA-256 for Android App Links: this is the value the
          # frontend's ANDROID_ASSETLINKS_FINGERPRINTS env var needs so share/invite links open
          # the app. Cert fingerprints are public — printing one leaks nothing.
          FP=$(keytool -list -v -keystore "$KS" -storepass "$MH_KEYSTORE_PASSWORD" -alias "$MH_KEY_ALIAS" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //') || true
          [ -n "$FP" ] && echo "::notice title=App Links fingerprint::Set ANDROID_ASSETLINKS_FINGERPRINTS=$FP on the frontend so share/invite links open the Android app."

          rm -rf "$KS" "$PROBE_DIR" "$PROBE_JAR"
          echo "Keystore, alias and both passwords check out — a release will attach a signed APK."
          emit true

      # Same posture as the signing preflight: report a broken Google Play setup on every push to
      # main, and never fail the job over it. Without a usable service-account key the release still
      # happens and still carries an APK — it just does not reach the Play Console.
      #
      # Nothing that identifies the account is printed: Actions logs on this repo are public.
      - name: Preflight — Google Play service account
        id: android_play
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ vars.ANDROID_PLAY_TRACK || 'internal' }}
        run: |
          set -uo pipefail

          if [ -z "${SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "No ANDROID_PLAY_SERVICE_ACCOUNT_JSON secret — releases are not published to Google Play. See android/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$SERVICE_ACCOUNT_JSON" \
            | jq -e 'select(.type == "service_account") | (.client_email and .private_key)' >/dev/null 2>&1; then
            echo "::error title=Google Play preflight::ANDROID_PLAY_SERVICE_ACCOUNT_JSON is not a Google Cloud service-account JSON key. Paste the whole downloaded file, not one field of it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Service-account key parses — a release will upload the bundle to the '$TRACK' track."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Gate the release on a green build of both deployables.
      - name: Frontend check / lint / build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run lint
          bun run test
          bun run build

      - name: API tests
        run: dotnet test MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj

      - name: semantic-release
        id: semrel
        working-directory: frontend
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If a new version was published, kick off the image build + Dokploy redeploy.
      - name: Trigger build & deploy
        if: steps.semrel.outputs.new_release_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
        run: gh workflow run aspire-deploy.yml --ref main -f version="$VERSION"

      # ── Android APK ────────────────────────────────────────────────────────────────────────
      # Built *after* semantic-release on purpose: the app is not deployed by a release, so an
      # Android breakage must never hold back the API/frontend deploy. CI already builds both
      # variants on every PR, so this failing is the unusual case. The release exists for a minute
      # or two without the APK attached.

      - name: Setup Android SDK
        if: steps.semrel.outputs.new_release_version != ''
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        if: steps.semrel.outputs.new_release_version != ''
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build Android APK and App Bundle
        id: apk
        if: steps.semrel.outputs.new_release_version != ''
        working-directory: android
        env:
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
          SIGNING_OK: ${{ steps.android_signing.outputs.ok }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # versionCode must increase monotonically forever, so derive it from the semver rather
          # than a run number: 1.2.3 -> 1002003. Leaves room for 999 minors and patches.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "Building $VERSION (versionCode $VERSION_CODE)"

          if [ "${SIGNING_OK:-false}" = "true" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MH_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            # Two artifacts from one signed release variant: the APK is what people sideload from
            # the GitHub release, the bundle is the only format Google Play accepts.
            ./gradlew :app:assembleRelease :app:bundleRelease \
              -PmhVersionName="$VERSION" -PmhVersionCode="$VERSION_CODE"
            SOURCE=app/build/outputs/apk/release/app-release.apk
            APK="$RUNNER_TEMP/musichoarder-$VERSION.apk"

            AAB_SOURCE=app/build/outputs/bundle/release/app-release.aab
            AAB="$RUNNER_TEMP/musichoarder-$VERSION.aab"
            test -f "$AAB_SOURCE" || { echo "::error::Expected AAB at $AAB_SOURCE"; exit 1; }
            cp "$AAB_SOURCE" "$AAB"
            echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          else
            # The preflight rejected the signing secrets (or there are none). `assembleRelease`
            # would yield an APK nobody can install, so publish the debug build instead and say so
            # in the filename. The preflight step above carries the reason.
            # No bundle either: Play rejects a debug-signed upload, so leaving the `aab` output
            # empty is what skips the publish step below.
            echo "::warning title=Unsigned release::Signing preflight did not pass — attaching a debug-signed APK and skipping Google Play. See the preflight step for the reason."
            ./gradlew :app:assembleDebug -PmhVersionName="$VERSION" -PmhVersionCode="$VERSION_CODE"
            SOURCE=app/build/outputs/apk/debug/app-debug.apk
            APK="$RUNNER_TEMP/musichoarder-$VERSION-debug.apk"
          fi

          # Fail loudly rather than uploading nothing: a renamed output would otherwise leave the
          # release quietly APK-less.
          test -f "$SOURCE" || { echo "::error::Expected APK at $SOURCE"; exit 1; }
          cp "$SOURCE" "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Attach APK to the release
        if: steps.semrel.outputs.new_release_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: gh release upload "v$VERSION" "$APK" --clobber

      # The bundle is not attached to the Release — an .aab is not installable, and offering one
      # next to the APK only invites people to download the wrong file. It goes to the run's
      # artifacts instead, which is where you fetch it from for the one manual Play Console upload
      # that has to happen before the API is allowed to publish (see android/README.md).
      - name: Upload the App Bundle as a run artifact
        if: steps.apk.outputs.aab != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: musichoarder-aab-${{ steps.semrel.outputs.new_release_version }}
          path: ${{ steps.apk.outputs.aab }}
          retention-days: 30
          if-no-files-found: error

      # ── Google Play ────────────────────────────────────────────────────────────────────────
      # Play's "What's new" is 500 characters of plain text per locale, so the Release's markdown
      # is flattened to bullets and cut at a whole line rather than pasted in. The link is appended
      # unconditionally, which also means the file is never empty — the upload rejects an empty one.
      #
      # awk stops printing rather than `exit`ing: exiting would close the pipe under the upstream
      # sed, and `pipefail` would then read the SIGPIPE as a failure — precisely on the long-notes
      # release that the truncation exists for.
      - name: Compose the Play release notes
        id: whatsnew
        if: steps.apk.outputs.aab != '' && steps.android_play.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/whatsnew"
          mkdir -p "$DIR"
          {
            gh release view "v$VERSION" --json body -q .body \
              | sed -n 's/^\* /- /p' \
              | sed -e 's/ (\[[^]]*\]([^)]*))//g' -e 's/\[\([^]]*\)\]([^)]*)/\1/g' -e 's/\*\*//g' \
              | awk '{ if (stop || n + length($0) + 1 > 380) { stop = 1; next } print; n += length($0) + 1 }'
            echo
            echo "Full notes: https://github.com/$REPO/releases/tag/v$VERSION"
          } > "$DIR/whatsnew-en-US"
          cat "$DIR/whatsnew-en-US"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # Publishes to the track named by the ANDROID_PLAY_TRACK repo variable, default `internal`.
      # Internal testing goes live in minutes with no review, which is the only track that keeps up
      # with a repo that can cut several releases in a day; promote a build to production from the
      # Play Console when you want one to reach everyone. Set the variable to `production` (and
      # ANDROID_PLAY_STATUS to `draft` if you would rather still press the button yourself) to
      # change that — see android/README.md for why you probably should not.
      #
      # Skipped when the preflight found no service-account key, so a fork releases exactly as it
      # did before this step existed.
      - name: Publish to Google Play
        if: steps.apk.outputs.aab != '' && steps.android_play.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.musichoarder.app
          releaseFiles: ${{ steps.apk.outputs.aab }}
          track: ${{ vars.ANDROID_PLAY_TRACK || 'internal' }}
          status: ${{ vars.ANDROID_PLAY_STATUS || 'completed' }}
          whatsNewDirectory: ${{ steps.whatsnew.outputs.dir }}
