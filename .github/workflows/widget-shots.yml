name: Widget screenshots

on:
  push:
    branches: [tmp/widget-shots]

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run sync
      - name: Add the temporary screenshot test target
        working-directory: .
        run: |
          gem install --user-install --no-document xcodeproj
          ruby .github/widget-shots/add-ui-target.rb
      - name: Build for screenshot testing
        run: |
          set -euo pipefail
          SIMULATOR="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project ios/App/App.xcodeproj \
            -scheme WidgetScreenshots \
            -configuration Debug \
            -destination "id=$SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Bundle the fixture and sign with the App Group
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"
          APPEX="$APP/PlugIns/MusicHoarderWidgets.appex"
          python3 ../.github/widget-shots/stage.py "$RUNNER_TEMP/widget-fixture"
          cp -R "$RUNNER_TEMP/widget-fixture/widgets" "$APP/WidgetFixtures"
          GROUP=group.com.musichoarder.app
          sed "s|[$](MH_APP_GROUP)|$GROUP|g" ios/App/App/App.entitlements > "$RUNNER_TEMP/app.entitlements"
          sed "s|[$](MH_APP_GROUP)|$GROUP|g" ios/App/Widgets/Widgets.entitlements > "$RUNNER_TEMP/widgets.entitlements"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -mindepth 1 -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | while IFS= read -r -d '' code; do codesign --force --sign - "$code"; done
          fi
          codesign --force --sign - --entitlements "$RUNNER_TEMP/widgets.entitlements" "$APPEX"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign -d --entitlements :- "$APP"
          codesign -d --entitlements :- "$APPEX"
      - name: Capture the system widget gallery and Home Screen
        run: |
          xcodebuild test-without-building \
            -project ios/App/App.xcodeproj \
            -scheme WidgetScreenshots \
            -configuration Debug \
            -destination "id=$SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/WidgetScreenshots.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/WidgetScreenshots.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/WidgetScreenshots.xcresult" \
              --output-path "$RUNNER_TEMP/shots"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: widget-shots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/WidgetScreenshots.xcresult
