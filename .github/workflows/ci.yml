# Restore, build, and test the .NET solution and the SvelteKit frontend.
# No deploy or container publishing — that's docker-publish.yml; the Android client has its
# own path-filtered workflow in android.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-drift:
    # Fails if the committed Aspire-generated prod compose is missing any env key the AppHost
    # declares, or if the self-host compose is missing a provider/feature key — the failure mode
    # that shipped AI lyrics transcription invisible in prod. Pure bash, no toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/budget

      - name: Check Aspire compose drift
        run: bash scripts/check-aspire-compose-drift.sh

      - uses: ./.github/actions/budget
        with:
          seconds: 30

  dotnet:
    runs-on: ubuntu-latest
    # For the few tests that need what only Postgres does ([PostgresFact]); the rest use EF InMemory.
    # Same major as the AppHost's image. Throwaway credentials, reachable only inside this job.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/budget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Saved by main's push runs and read by every PR, which may use caches from the base branch.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj

      - name: Build
        run: dotnet build MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-restore -c Release

      # Not in the solution, so nothing else compiles it; a build that breaks here otherwise shows up
      # only when someone next runs `bun perf up`.
      - name: Build perf seed
        run: dotnet build perf/seed/MusicHoarder.PerfSeed.csproj -c Release

      - name: Test
        run: dotnet test MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-build -c Release --verbosity normal
        env:
          MUSICHOARDER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres

      # 200 since the clean-edit check (PR #805): main already ran 165-170 s, and the check adds a
      # migration snapshot to build and spectrogram tests to run, about 15 s together. 210 since hosted
      # storage (PR #809): main ran about 194 s, and the PR's migration snapshot and asset tests add
      # 3 s to the build and 2 s to the tests, which left no room for a restore that varies by 10 s.
      - uses: ./.github/actions/budget
        with:
          seconds: 210

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/budget

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint, type check, test and build (side by side)
        run: scripts/ci-checks.sh

      - uses: ./.github/actions/budget
        with:
          seconds: 90
