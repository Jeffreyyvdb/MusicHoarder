# Restore, build, and test the .NET solution, the SvelteKit frontend, and the Android client.
# No deploy or container publishing — that's docker-publish.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-drift:
    # Fails if the committed Aspire-generated prod compose is missing any env key the AppHost
    # declares, or if the self-host compose is missing a provider/feature key — the failure mode
    # that shipped AI lyrics transcription invisible in prod. Pure bash, no toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Aspire compose drift
        run: bash scripts/check-aspire-compose-drift.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj

      - name: Build
        run: dotnet build MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-build -c Release --verbosity normal

  android:
    # Builds and unit-tests the native client. `assembleRelease` runs too: with no keystore on a PR
    # it only yields an unsigned APK, but it is the one thing that exercises the release variant's
    # config — and that config breaking would otherwise surface in the release workflow, after a
    # version has already been cut.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches android/gradle/gradle-daemon-jvm.properties; without it Gradle would go and
          # provision its own toolchain on every run.
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Caches ~/.gradle and validates the committed wrapper jar. The build root comes from the
      # job's working-directory, not an input — `build-root-directory` no longer exists.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run check
      - run: bun run test
