# Restore, build, and test the .NET solution and the SvelteKit frontend.
# No deploy or container publishing — that's docker-publish.yml; the Android client has its
# own path-filtered workflow in android.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-drift:
    # Fails if the committed Aspire-generated prod compose is missing any env key the AppHost
    # declares, or if the self-host compose is missing a provider/feature key — the failure mode
    # that shipped AI lyrics transcription invisible in prod. Pure bash, no toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Aspire compose drift
        run: bash scripts/check-aspire-compose-drift.sh

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Saved by main's push runs and read by every PR, which may use caches from the base branch.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj

      - name: Build
        run: dotnet build MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test MusicHoarder.Api.Tests/MusicHoarder.Api.Tests.csproj --no-build -c Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint, type check and test (side by side)
        run: scripts/ci-checks.sh
