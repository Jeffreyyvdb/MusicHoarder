version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Defense against supply-chain attacks (e.g. Shai-Hulud): only propose
    # versions that have been published long enough for the registry/community
    # to catch and yank malicious releases. Security advisories from GitHub's
    # advisory database are not subject to cooldown.
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
      include:
        - '*'
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps)'
      include: 'scope'
    # @sveltejs/adapter-node 5.5.5 ONLY is broken: that release bundled the
    # request handler into a nested build/server/chunks/*.js instead of
    # build/handler.js, breaking the adapter's `import.meta.url`-relative
    # resolution of the static `client/` dir — every /_app/immutable/* and
    # static asset 404s (SSR still works), so the SvelteKit client never
    # hydrates (sveltejs/kit#16095). Fixed upstream in 5.5.6 (#16114, which also
    # fixes a separate boot deadlock #16092); we run 5.5.7. Ignore exactly 5.5.5
    # so it can never come back; 5.5.6+ are allowed through normally.
    #
    # conventional-changelog-conventionalcommits v10 moved its writer
    # templates into the separate @conventional-changelog/template package and
    # changed the preset shape. @semantic-release/release-notes-generator (14.x,
    # latest) still expects the v8/v9 shape, so under v10 it renders the release
    # header and *nothing else* — every GitHub Release from v1.95.1 (2026-07-08,
    # the push that merged the v10 bump) onward had an empty body. Stay on 9.x
    # until release-notes-generator ships v10 support.
    #
    # TypeScript 7 is the native (Go) port: `require('typescript')` now
    # resolves to a stub exporting only { version, versionMajorMinor }, and
    # the classic compiler API lives behind unfinished `typescript/unstable/*`
    # entrypoints. Every type-aware tool we run breaks on it —
    # @typescript-eslint/typescript-estree dies at import time reading
    # `ts.Extension.Cjs` off that stub ("Cannot read properties of undefined
    # (reading 'Cjs')", PR #348), and its peer range is `<6.1.0`, so no
    # released typescript-eslint accepts TS 7 at all. svelte-check /
    # svelte2tsx are in the same boat. Hold at 5.x until typescript-eslint
    # ships a TS 7-compatible major and svelte-check follows; then drop this
    # entry and take the bump deliberately.
    ignore:
      - dependency-name: '@sveltejs/adapter-node'
        versions: ['5.5.5']
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # Patch + minor bumps are grouped per dependency-type so the weekly
    # delivery is at most two bun PRs (prod-deps, dev-deps) instead of one
    # per package. Majors stay ungrouped — they're rare and deserve
    # individual scrutiny.
    #
    # Auto-merge still gates correctly: dependabot/fetch-metadata reports
    # the highest semver bump in a grouped PR, so a group containing any
    # major reports `semver-major` and skips auto-merge.
    groups:
      production-deps:
        dependency-type: 'production'
        update-types:
          - 'patch'
          - 'minor'
      development-deps:
        dependency-type: 'development'
        update-types:
          - 'patch'
          - 'minor'
    labels:
      - 'dependencies'
      - 'bun'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # github-actions ecosystem only supports `default-days` for cooldown
    # (no per-semver-level fields).
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    # All github-actions bumps land in one weekly PR. Actions versions
    # don't tend to break things subtly, and this ecosystem doesn't drive
    # semantic-release, so a single grouped PR is enough.
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'

  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
      include:
        - '*'
    # `chore(deps)` (not `fix(deps)`) so .NET bumps never trigger the
    # frontend's semantic-release pipeline. The .NET API isn't versioned
    # via semver tags — it ships via the docker-publish workflow's
    # sha-tagged GHCR images, so the prefix is purely informational.
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      nuget-deps:
        update-types:
          - 'patch'
          - 'minor'
    labels:
      - 'dependencies'
      - 'nuget'
