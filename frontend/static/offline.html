<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline · MusicHoarder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!--
      Served by src/service-worker.ts when a navigation fails at the network level — typically an
      installed (home-screen) app launched without connectivity. Self-contained on purpose: it is
      the only thing the worker caches, so it must not depend on any other asset. Its colours are
      hex copies of the app.css tokens (--background, --foreground, --muted-foreground, --primary /
      --primary-foreground), so the page and the status bar painted from theme-color match the app.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #000000;
        --muted: #5f5f64;
        --tint: #006b1f;
        --on-tint: #ffffff;
        --disc: #000000;
        --label: #ffffff;
        --groove: #5f5f64;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #000000;
          --fg: #ffffff;
          --muted: #a1a1a6;
          --tint: #2fbd55;
          --on-tint: #000000;
          --disc: #ffffff;
          --label: #000000;
          --groove: #a1a1a6;
        }
      }
      :root[data-theme='dark'] {
        --bg: #000000;
        --fg: #ffffff;
        --muted: #a1a1a6;
        --tint: #2fbd55;
        --on-tint: #000000;
        --disc: #ffffff;
        --label: #000000;
        --groove: #a1a1a6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }
      /* An iOS empty state: plain page, no card — mark, title, one line of help, one action. */
      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }
      svg {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
      }
      /* iOS title-1 / body — the app's text-title-1 and text-body. */
      h1 {
        margin: 0 0 0.5rem;
        font-size: 28px;
        line-height: 34px;
        font-weight: 700;
      }
      p {
        margin: 0 0 1.75rem;
        font-size: 17px;
        line-height: 22px;
        color: var(--muted);
      }
      /* The one prominent action: a 50px tint capsule, as on the sign-in page. */
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        width: 100%;
        min-height: 50px;
        padding: 0 1.25rem;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: var(--on-tint);
        background: var(--tint);
        cursor: pointer;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--tint) 50%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 180 180" aria-hidden="true">
        <g transform="translate(90 90)">
          <circle fill="var(--disc)" r="70" />
          <circle fill="none" stroke="var(--groove)" stroke-width="1" opacity="0.5" r="58" />
          <circle fill="none" stroke="var(--groove)" stroke-width="0.75" opacity="0.35" r="48" />
          <circle fill="none" stroke="var(--groove)" stroke-width="0.5" opacity="0.25" r="38" />
          <circle fill="var(--label)" r="22" />
          <circle fill="var(--disc)" r="8" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        MusicHoarder streams from your own server, so it needs a connection. This page reloads by
        itself as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Honour a theme the app pinned (mode-watcher persists it), else follow the system.
      try {
        var mode = localStorage.getItem('mode-watcher-mode');
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
      } catch (_) {}
      addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
