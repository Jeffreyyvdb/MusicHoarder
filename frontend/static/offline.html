<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline · MusicHoarder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060709" media="(prefers-color-scheme: dark)" />
    <!--
      Served by src/service-worker.ts when a navigation fails at the network level — typically an
      installed (home-screen) app launched without connectivity. Self-contained on purpose: it is
      the only thing the worker caches, so it must not depend on any other asset.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --card: #fafafa;
        --disc: #0a0a0a;
        --label: #fafafa;
        --groove: #525252;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --card: #141414;
          --disc: #fafafa;
          --label: #0a0a0a;
          --groove: #a3a3a3;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #a3a3a3;
        --border: #262626;
        --card: #141414;
        --disc: #fafafa;
        --label: #0a0a0a;
        --groove: #a3a3a3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
        text-align: center;
      }
      svg {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.1rem;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--bg);
        background: var(--fg);
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 180 180" aria-hidden="true">
        <g transform="translate(90 90)">
          <circle fill="var(--disc)" r="70" />
          <circle fill="none" stroke="var(--groove)" stroke-width="1" opacity="0.5" r="58" />
          <circle fill="none" stroke="var(--groove)" stroke-width="0.75" opacity="0.35" r="48" />
          <circle fill="none" stroke="var(--groove)" stroke-width="0.5" opacity="0.25" r="38" />
          <circle fill="var(--label)" r="22" />
          <circle fill="var(--disc)" r="8" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        MusicHoarder streams from your own server, so it needs a connection. This page reloads by
        itself as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Honour a theme the app pinned (mode-watcher persists it), else follow the system.
      try {
        var mode = localStorage.getItem('mode-watcher-mode');
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
      } catch (_) {}
      addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
