<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- Installed (home-screen) app. The manifest's `display: standalone` already launches without
         browser chrome on iOS; these Apple-specific tags cover what the manifest cannot: a
         translucent status bar (the page draws under it, so every top-anchored surface pads by
         env(safe-area-inset-top), which is 0 in a browser tab) and the home-screen label. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MusicHoarder" />
    <meta name="application-name" content="MusicHoarder" />
    <meta name="format-detection" content="telephone=no" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    data-sveltekit-preload-code="viewport"
    class="bg-background text-foreground font-sans antialiased"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
